name: Publish Slisk v1.1.6
on:
  workflow_run:
    workflows: ["Slisk PS4 standalone payload"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Ensure this is the current main revision and release has not been published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
          if gh release view v1.1.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.6 release already exists; not overwriting it."
            exit 1
          fi
      - name: Fetch ELF and full GPLv3 source archive from successful build
        uses: actions/download-artifact@v4
        with:
          name: slisk-x360-directusb-ps4-experimental
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify both files
        run: |
          test -s release-assets/slisk-x360-directusb.elf
          test -s release-assets/slisk-complete-source.tar.gz
          file release-assets/slisk-x360-directusb.elf
          tar -tzf release-assets/slisk-complete-source.tar.gz | grep -q systempayload/src/slisk_usb.c
          tar -tzf release-assets/slisk-complete-source.tar.gz | grep -q upstream/LICENSE
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v1.1.6 release-assets/slisk-x360-directusb.elf release-assets/slisk-complete-source.tar.gz release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "Slisk v1.1.6 — Xbox 360 Wireless Controllers on PS4" \
            --notes-file RELEASE-NOTES-v1.1.6.md
